<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome student!</title>
  <link rel="stylesheet" href="styles/studentModule.css">
  <meta name="color-scheme" content="only light">
</head>
<body>
  <div class="viewport-div">
    <div class="nav-bar">
      <div id="uni-logo"></div>
      <p id="nav-bar-text1">Welcome, student!</p>
      <div id="profile-logo"></div>
      <div class="student-details">
        <p id="nav-bar-text2">Student</p>
        <p id="student-name">Helo</p>
      </div>
      <button id="logout-button">Logout</button>
    </div>
    <div class="main-div">
      <div class="sidebar-div">
        <div class="dashboard-div">
          <div id="dashboard-image"></div>
          <p id="sidebar-text">Dashboard overview</p>
        </div>
        <div class="profile-div">
          <div id="profile-image"></div>
          <p id="sidebar-text">Profile</p>
        </div>
      </div>
      <div class="content-div">
        <div class="resume-list-header">
          <p id="resume-list-header-text">My resumes</p>
          <button id="add-resume-button">+ Upload new resume</button>
          <input
            type="file"
            id="resumeInput"
            accept=".pdf,application/pdf"
            hidden
          >
            <!-- We have hidden the button formed by this input elemenet because we have our custom button for that purpose -->
        </div>
        <div class="resume-list-div"></div>
      </div>
    </div>
  </div>
</body>
<script src="scripts/studentModule.js"></script>
</html>
