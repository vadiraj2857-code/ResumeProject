<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/style.css">
  <script src="scripts/script.js"></script>
</head>
<body>
  <div class="login-bar">
    <div class="college-logo"></div>
    <p class="college-name">GLOBAL ACADEMY OF TECHNOLOGY</p>
  </div>
  <div class="main-div">
    <div class="content-div">
      <div class="text-div">
        <p class="content-text1">UNIVERSITY PORTAL</p>
        <p class="content-text2">Welcome, please login.</p>
      </div> 
      <div class="icon-modes">
        <div class="student-icon icon" onclick="studentLogin()"></div>
        <div class="HR-icon icon" onclick="HRlogin()"></div>
        <div class="admin-icon icon" onclick="adminLogin()"></div>
        <div class="placement-icon icon"></div>
      </div>
      <div class="login-box login-box-js">
        <div class="login-boxText"></div>
      </div>
    </div>
  </div>
</body>
</html>
